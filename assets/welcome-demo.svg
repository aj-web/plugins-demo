<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  
  <!-- 左侧边栏 -->
  <rect x="0" y="0" width="280" height="600" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  
  <!-- 侧边栏头部 -->
  <rect x="0" y="0" width="280" height="80" fill="#2a2a2a"/>
  <text x="20" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Plugins</text>
  
  <!-- 折叠按钮 -->
  <circle cx="250" cy="40" r="15" fill="#3a3a3a"/>
  <path d="M245 35 L255 40 L245 45" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- 插件导航项 -->
  <rect x="8" y="100" width="264" height="50" fill="#4a4a4a" rx="4"/>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">video_joiner_plugin</text>
  
  <rect x="8" y="160" width="264" height="50" fill="#2a2a2a" rx="4"/>
  <text x="50" y="190" font-family="Arial, sans-serif" font-size="14" fill="#cccccc">示例插件 2</text>
  
  <rect x="8" y="220" width="264" height="50" fill="#2a2a2a" rx="4"/>
  <text x="50" y="250" font-family="Arial, sans-serif" font-size="14" fill="#cccccc">示例插件 3</text>
  
  <!-- 右侧主内容区域 -->
  <rect x="280" y="0" width="520" height="600" fill="#1a1a1a"/>
  
  <!-- 内容头部 -->
  <rect x="280" y="0" width="520" height="100" fill="#1a1a1a"/>
  <text x="312" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Workspace</text>
  <text x="312" y="65" font-family="Arial, sans-serif" font-size="16" fill="#888888">管理您的插件和工作空间</text>
  
  <!-- 欢迎页面图标 -->
  <circle cx="560" cy="250" r="60" fill="url(#gradient)"/>
  <path d="M530 220 L590 280 M530 280 L590 220" stroke="#ffffff" stroke-width="4" fill="none"/>
  
  <!-- 欢迎标题 -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">欢迎使用优创客户端</text>
  
  <!-- 欢迎副标题 -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">从左侧选择插件开始您的工作</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">每个插件都提供独特的功能</text>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>