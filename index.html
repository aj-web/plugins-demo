<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优创客户端体验版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
    }

    body {
      display: flex;
      background: #1a1a1a;
      color: #ffffff;
    }

    /* 左侧边栏 */
    .sidebar {
      width: 280px;
      background: #2a2a2a;
      border-right: 1px solid #3a3a3a;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 60px;
      min-width: 60px;
    }

    /* 侧边栏头部 */
    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar:not(.collapsed) .sidebar-title {
      opacity: 1;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
    }

    .toggle-btn:hover {
      background: #3a3a3a;
    }

    .toggle-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .sidebar.collapsed .toggle-btn svg {
      transform: rotate(180deg);
    }

    /* 确保折叠状态下按钮仍然可见 */
    .sidebar.collapsed .toggle-btn {
      opacity: 1;
      visibility: visible;
      position: relative;
      z-index: 10;
    }

    /* 折叠状态下调整按钮位置 */
    .sidebar.collapsed .sidebar-header {
      justify-content: center;
    }

    .sidebar.collapsed .sidebar-title {
      display: none;
    }

    /* 插件导航 */
    .plugin-nav {
      flex: 1;
      padding: 16px 0;
      overflow: hidden;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-section-title {
      padding: 0 16px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar:not(.collapsed) .nav-section-title {
      opacity: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: #cccccc;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 0;
      margin: 0 8px;
      white-space: nowrap;
    }

    .nav-item:hover {
      background: #3a3a3a;
      color: #ffffff;
    }

    .nav-item.active {
      background: #4a4a4a;
      color: #ffffff;
    }

    .nav-item-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      flex-shrink: 0;
    }

    .sidebar:not(.collapsed) .nav-item-icon {
      opacity: 1;
    }

    .sidebar.collapsed .nav-item-icon {
      opacity: 1;
      margin-right: 0;
    }

    .nav-item-text {
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar:not(.collapsed) .nav-item-text {
      opacity: 1;
    }

    /* 右侧主内容区域 */
    .main-content {
      flex: 1;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部标题栏 */
    .content-header {
      padding: 24px 32px;
      border-bottom: 1px solid #3a3a3a;
    }

    .content-title {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .content-subtitle {
      font-size: 16px;
      color: #888888;
      font-weight: 400;
    }

    /* 内容区域 */
    .content-body {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    /* 插件容器 */
    #plugin-container {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
    }

    /* 欢迎页面 */
    .welcome-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }

    .welcome-icon {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }

    .welcome-icon svg {
      width: 60px;
      height: 60px;
      color: #ffffff;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .welcome-subtitle {
      font-size: 18px;
      color: #888888;
      max-width: 500px;
      line-height: 1.6;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #2a2a2a;
    }

    ::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }
    }

    /* 框架样式保护 - 确保框架元素不被插件样式影响 */
    body, html {
      /* 防止插件修改全局样式 */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #1a1a1a !important;
      color: #ffffff !important;
    }

    /* 保护侧边栏样式 */
    .sidebar,
    .sidebar * {
      /* 确保侧边栏样式不被插件影响 */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    /* 保护主内容区域头部 */
    .content-header,
    .content-header * {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    /* 插件容器样式隔离 */
    #plugin-container {
      /* 确保插件容器有独立的样式作用域 */
      all: initial;
      display: block;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #plugin-container * {
      /* 重置插件内部元素的样式继承 */
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- 左侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Plugins</h2>
      <button class="toggle-btn" id="toggle-btn" title="折叠/展开侧边栏" aria-label="折叠或展开侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>
    
    <div class="plugin-nav" id="plugin-nav">
      <!-- 插件列表将通过 JavaScript 动态生成 -->
    </div>
  </div>

  <!-- 右侧主内容区域 -->
  <div class="main-content">
    <div class="content-header">
      <h1 class="content-title">Workspace</h1>
      <p class="content-subtitle">管理您的插件和工作空间</p>
    </div>
    
    <div class="content-body">
      <!-- 默认欢迎页面 -->
      <div class="welcome-page" id="welcome-page">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h2 class="welcome-title">欢迎使用优创客户端</h2>
        <p class="welcome-subtitle">
          从左侧选择插件开始您的工作。每个插件都提供独特的功能，帮助您更高效地完成任务。
        </p>
      </div>
      
      <!-- 插件容器 -->
      <div id="plugin-container" style="display: none;"></div>
    </div>
  </div>

  <script src="load_plugins.js"></script>
</body>
</html>
