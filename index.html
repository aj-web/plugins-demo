<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优创客户端体验版</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100vw;
      box-sizing: border-box;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    #menu-bar {
      flex: 0 0 auto;
      background: #f5f5f5;
      padding: 6px 10px;
      border-bottom: 1px solid #e0e0e0;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #plugin-container {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      box-sizing: border-box;
      overflow: auto;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="menu-bar"></div>
  <div id="plugin-container"></div>
  <script src="load_plugins.js"></script>
</body>
</html>
