<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>视频拼接插件</title><script>// 定义全局变量，解决浏览器环境中global未定义的问题
    if (typeof global === 'undefined') {
      window.global = window;
    }</script><style>body {
      margin: 0;
      background: #f4f4f4;
      color: #222;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #e9e9e9;
      border-bottom: 1px solid #ccc;
      gap: 12px;
    }
    .topbar label {
      margin-right: 4px;
      font-size: 1rem;
    }
    .topbar input[type="text"] {
      width: 220px;
      padding: 3px 8px;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: #fff;
      font-size: 1rem;
    }
    .topbar button, .topbar select {
      padding: 4px 14px;
      font-size: 1rem;
      border-radius: 3px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      cursor: pointer;
      margin-right: 4px;
    }
    .main-area {
      display: flex;
      height: calc(100vh - 120px);
      background: #f4f4f4;
    }
    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .panel-title {
      font-weight: bold;
      font-size: 1.05rem;
      background: #f7f7f7;
      border-bottom: 1px solid #eee;
      padding: 8px 14px;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 0.98rem;
      background: #fff;
    }
    .bottom-bar {
      height: 80px;
      background: #e9e9e9;
      border-top: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 24px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      font-size: 0.98rem;
      margin-bottom: 6px;
      gap: 18px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-bar {
      flex: 1;
      height: 18px;
      background: #ddd;
      border-radius: 9px;
      overflow: hidden;
      margin-right: 10px;
    }
    .progress-inner {
      height: 100%;
      background: #4a90e2;
      width: 0%;
      transition: width 0.3s;
    }
    .bottom-bar button {
      min-width: 110px;
      margin-right: 10px;
      font-size: 1rem;
      padding: 5px 0;
      border-radius: 3px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      cursor: pointer;
    }
    .bottom-bar button:disabled {
      background: #eee;
      color: #aaa;
      cursor: not-allowed;
    }</style><script defer="defer" src="main.js"></script><script defer="defer" src="main.js"></script><script defer="defer" src="main.js"></script></head><body><div class="topbar"><button id="select-folder-btn">选择文件夹</button> <span>当前目录: <span id="current-dir">未选择</span></span> <button id="analyze-btn">分析文件夹</button> <label for="parallel-num">并行任务数:</label> <select id="parallel-num"><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="8">8</option></select></div><div class="main-area"><div class="left-panel"><div class="panel-title">视频文件夹</div><div class="panel-content" id="folder-list"></div></div><div class="right-panel"><div class="panel-title">任务列表</div><div class="panel-content" id="task-list"></div></div></div><div class="bottom-bar"><div class="stat-row"><span id="stat-match">匹配: 0 个配对</span> <span id="stat-unmatched-intro">未匹配前贴: 0</span> <span id="stat-unmatched-main">未匹配正片: 0</span> <span id="stat-task">任务: 0 个</span> <span id="stat-progress">总进度: 0/0</span> <span id="stat-time">已用时间: 00:00:00</span></div><div class="progress-row"><div class="progress-bar"><div class="progress-inner" id="progress-inner"></div></div><button id="start-btn">开始处理</button> <button id="stop-btn" disabled="disabled">停止处理</button></div></div></body></html>
