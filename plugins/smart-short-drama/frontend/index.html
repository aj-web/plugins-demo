<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短剧智造客户端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#f5f7fa',
              surface: '#ffffff',
              primary: '#409eff',
              secondary: '#e4e7ed',
              accent: '#66b1ff',
              danger: '#f56c6c',
              success: '#67c23a',
              warning: '#e6a23c',
              textMain: '#303133',
              textRegular: '#606266',
              textSecondary: '#909399'
            },
            fontFamily: {
              sans: ['Helvetica Neue', 'Helvetica', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Arial', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f5f7fa;
      }
      ::-webkit-scrollbar-thumb {
        background: #c0c4cc;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #909399;
      }
      body {
        background-color: #f5f7fa;
        color: #303133;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
